<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mefixo | Home Services</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#fff;
  color:#111;
  cursor:none;
  overflow-x:hidden;
}

/* RED CURSOR */
.cursor{
  position:fixed;
  width:14px;
  height:14px;
  background:red;
  border-radius:50%;
  pointer-events:none;
  transform:translate(-50%,-50%);
  z-index:9999;
}

/* NAVBAR */
nav{
  position:fixed;
  top:0;
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 8%;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(10px);
  box-shadow:0 5px 25px rgba(0,0,0,0.05);
  z-index:1000;
}

.logo img{
  height:95px;   /* Bigger logo */
}

nav ul{
  display:flex;
  gap:40px;
  list-style:none;
}

nav ul li a{
  text-decoration:none;
  color:#111;
  font-weight:600;
}

/* HERO RAINBOW GRADIENT */
.hero{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:0 10%;
  background:linear-gradient(270deg,
  #ff6b6b,
  #feca57,
  #1dd1a1,
  #54a0ff,
  #5f27cd,
  #ff6b6b);
  background-size:1200% 1200%;
  animation:rainbow 15s ease infinite;
}

@keyframes rainbow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.hero h1{
  font-size:60px;
  color:white;
  margin-bottom:20px;
}

.hero p{
  font-size:18px;
  color:white;
  margin-bottom:30px;
}

.hero a{
  background:white;
  color:black;
  padding:15px 40px;
  border-radius:50px;
  text-decoration:none;
  font-weight:600;
}

/* SECTIONS */
.section{
  padding:120px 8%;
  text-align:center;
}

/* SERVICES */
.services{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:40px;
  margin-top:60px;
}

.card{
  background:white;
  padding:45px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.05);
  cursor:pointer;
  transition:0.4s;
}

.card:hover{
  transform:translateY(-10px);
}

/* POPUP MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.4);
  backdrop-filter:blur(8px);
  opacity:0;
  visibility:hidden;
  transition:0.3s;
  z-index:2000;
}

.modal.active{
  opacity:1;
  visibility:visible;
}

.modal-content{
  background:white;
  padding:40px;
  border-radius:20px;
  width:400px;
  text-align:center;
  transform:scale(0.8);
  transition:0.3s;
}

.modal.active .modal-content{
  transform:scale(1);
}

.close-btn{
  margin-top:20px;
  background:red;
  color:white;
  padding:8px 20px;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="cursor"></div>

<nav>
<div class="logo">
<img src="images/logo.png">
</div>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<section class="hero">
<h1>Trusted Home Services in Surat</h1>
<p>Professional Plumber, Electrician & Carpenter</p>
<a href="#">Book Now</a>
</section>

<section class="section">
<h2>Our Services</h2>

<div class="services">
<div class="card" onclick="openModal('Plumber Service')"><h3>Plumber</h3></div>
<div class="card" onclick="openModal('Electrician Service')"><h3>Electrician</h3></div>
<div class="card" onclick="openModal('Carpenter Service')"><h3>Carpenter</h3></div>
</div>

</section>

<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalText"></h3>
<p>Professional doorstep service available.</p>
<button class="close-btn" onclick="closeModal()">Close</button>
</div>
</div>

<script>
/* RED CURSOR */
const cursor = document.querySelector(".cursor");
document.addEventListener("mousemove", e=>{
  cursor.style.left = e.clientX + "px";
  cursor.style.top = e.clientY + "px";
});

/* POPUP */
function openModal(service){
  document.getElementById("modalText").innerText = service;
  document.getElementById("modal").classList.add("active");
}

function closeModal(){
  document.getElementById("modal").classList.remove("active");
}
</script>

</body>
</html>
